/* ===== План вперёд, период, реальный автоаудит, развитие ===== */
const PER=['Разово','Ежемесячно','Ежеквартально','Раз в полгода','Ежегодно'],STEP={'Ежемесячно':1,'Ежеквартально':3,'Раз в полгода':6,'Ежегодно':12};
const PLH=()=>{let h=3;try{h=+localStorage.getItem('esa-plh')||3}catch(e){}return Math.min(12,Math.max(1,Math.round(h)))};
const ymAdd=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')};
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],ymTxt=ym=>MN[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
function planGen(h){h=h||PLH();if(!S||S.role=='acc')return 0;const cur=TD().slice(0,7),end=ymAdd(cur,h);let n=0;
S.clients.filter(c=>c.act&&(ME==null||c.ch==ME)).forEach(c=>{const G={};S.tasks.forEach(t=>{if(t.cl!=c.id||t.au!=null||!STEP[t.per]||!t.due)return;const k=t.t+'|'+t.per;if(!G[k]||t.due>G[k].due)G[k]=t});
Object.values(G).forEach(b=>{const st=STEP[b.per],day=String(Math.min(+b.due.slice(8,10)||15,28)).padStart(2,'0');let ym=ymAdd(b.due.slice(0,7),st);
while(ym<=end){if(ym>=cur&&!S.tasks.some(x=>x.cl==c.id&&x.t==b.t&&x.due.slice(0,7)==ym)){S.tasks.push({id:nid(S),cl:c.id,t:b.t,per:b.per,emp:b.emp,due:ym+'-'+day,st:'new',sp:0,run:0,h:b.h,by:null,cr:TD()});n++}ym=ymAdd(ym,st)}})});
return n}

const rows=Array.from({length:h+1},(_,i)=>{const ym=ymAdd(cur,i),L=T.filter(t=>t.due&&t.due.slice(0,7)==ym);return `<tr><td>${ymTxt(ym)}</td><td class=tm>${L.length}</td><td class=tm>${L.filter(t=>t.st=='done').length}</td></tr>`}).join('');

function impXGo(){if(!IMP)return;const upd=($('#ix_u')||{}).checked,mk=($('#ix_t')||{}).checked,ch=+(($('#ix_c')||{}).value)||0;if(mk&&!ch){toast('Для создания задач выберите главбуха');return}let add=0,up=0,skip=0,k=0;IMP.forEach(r=>{if(r.dupF){skip++;return}const ex=findEx(r);if(ex){if(upd){ex.n=r.n;if(r.inn)ex.inn=r.inn;ex.ettn=r.ettn;ex.nal=r.nal;if(r.reg)ex.reg=r.reg;if(r.no)ex.no=r.no;up++}else skip++;return}const c={id:nid(S),act:1,ch,tar:'',n:r.n,inn:r.inn,ettn:r.ettn,reg:r.reg,nal:r.nal,no:r.no||nextNo()};S.clients.push(c);if(mk)taskSet(c,k++).forEach(t=>S.tasks.push(t));add++;if(r.reg&&!S.ref.reg.includes(r.reg))S.ref.reg.push(r.reg)});IMP=null;mx();try{logA('загрузил клиентов из Excel: добавлено '+add+', обновлено '+up)}catch(e){}toast('Добавлено: '+add+(up?', обновлено: '+up:'')+(skip?', пропущено: '+skip:''));S.view='cl';go()}
function bulkForm(){const chiefs=S.emps.filter(e=>e.r=='chief'),n=S.clients.filter(c=>c.act&&!S.tasks.some(t=>t.cl==c.id)).length;if(!chiefs.length){toast('Сначала добавьте главбуха в разделе «Сотрудники»');return}modal(`<h3>Главбух и задачи по смете</h3><p>Клиентов без задач: <b>${n}</b>. Для них будет назначен главбух (если он не указан) и созданы ежемесячные задачи по смете. Исполнители распределятся между бухгалтерами.</p><select id=bk_c>${chiefs.map(e=>`<option value='${e.id}'>${E(e.n)}</option>`).join('')}</select><div class=row><button class='b p' onclick='bulkGo()' ${n?'':'disabled'}>Создать</button><button class=b onclick='mx()'>Отмена</button></div>`)}
function bulkGo(){const ch=+$('#bk_c').value;if(!ch)return;let n=0;S.clients.filter(c=>c.act&&!S.tasks.some(t=>t.cl==c.id)).forEach((c,k)=>{if(!c.ch)c.ch=ch;taskSet(c,k).forEach(t=>S.tasks.push(t));n++});mx();try{logA('создал задачи по смете для клиентов: '+n)}catch(e){}toast('Задачи созданы для клиентов: '+n);go()}
